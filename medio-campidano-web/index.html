<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Negozi Medio Campidano</title><style>body{font-family:system-ui;background:#f5f7f6;color:#17201e;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:white;padding:24px;border-radius:16px;border:1px solid #dfe6e3;text-align:center;max-width:520px}.dot{width:42px;height:42px;border:5px solid #dff3ee;border-top-color:#0f766e;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="dot"></div><b>Apro Negozi Medio Campidano…</b><p id="m">Caricamento dei 181 punti vendita fisici.</p></div><script>(async()=>{try{const names=['part0.txt','part1.txt','part2.txt','part3.txt'];const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(n+' '+r.status);return r.text()}));const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));let html=new TextDecoder('utf-8').decode(bytes);html += '<script src="search-loader.js?v=20261014-1"><\/script><script src="camera-loader.js?v=20261014-3"><\/script><script src="price-loader.js?v=20261014-2"><\/script>';document.open();document.write(html);document.close()}catch(e){document.getElementById('m').textContent='Errore di caricamento: '+e.message}})();</script></body></html>
