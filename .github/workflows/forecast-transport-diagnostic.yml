name: Forecast transport diagnostic
on:
  push:
    branches: [repair/forecast-transport-20261011]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public frontend and state without model requests or writes
        run: |
          python3 - <<'PY'
          import urllib.request, json, re, hashlib, pathlib
          def get(url):
              with urllib.request.urlopen(url, timeout=45) as r:
                  return r.read().decode('utf-8')
          html=get('https://meteo-arbus-guspini.netlify.app/')
          pathlib.Path('frontend.html').write_text(html)
          print('FRONTEND_SHA256',hashlib.sha256(html.encode()).hexdigest())
          lines=html.splitlines()
          selected=set()
          for i,line in enumerate(lines):
              if re.search(r'open-meteo|async function loadForecasts|function fetchJson|function fetchGFS|function fetchECMWF|async function fetch|setInterval|METEO_CRON_MODE|function loadForecasts',line,re.I):
                  selected.update(range(max(0,i-3),min(len(lines),i+32)))
          for i in sorted(selected):
              line=re.sub(r'((?:apikey|api_key|token|secret)\s*[:=]\s*[\x22\x27]?)[^\s\x22\x27&<>]+',r'\1REDACTED',lines[i],flags=re.I)
              print(f'SRC {i+1}: {line[:1500]}')
          base='https://meteo-arbus-guspini-api.onrender.com'
          state=json.loads(get(base+'/automation/state'))
          s=state.get('state',{})
          print('STATE',json.dumps({'archive':len(s.get('archive',[])),'history':len(s.get('history',[])),'meta':s.get('automationMeta'),'settings':s.get('settings')},ensure_ascii=False))
          spec=json.loads(get(base+'/openapi.json'))
          print('ENDPOINTS',json.dumps(list(spec.get('paths',{}))))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-frontend-source
          path: frontend.html
          retention-days: 2
